schema: spec-driven

context: |
  Project: Grid Survival Simulator — offline Flutter calculator for grid trading risk analysis.
  Tech stack: Flutter 3.x, Dart, Riverpod (state), Hive (persistence), fl_chart (charts).
  Architecture: packages/grid_engine/ (pure Dart engine, no Flutter dependency) + app/ (Flutter UI).
  Engine modules: GridBuilder, MarginCalculator, PnlCalculator, SurvivalEngine, ScenarioEngine, ReverseSolver, ConstraintEvaluator, GapAnalyzer.
  Testing: 58+ engine unit tests (golden cases, edge cases, regression), no Flutter widget tests yet.
  Build: GitHub Actions (debug APK, gradle direct, no EAS).
  Monetization: AdMob (banner + interstitial + rewarded), test_ads flag in config.
  Monitoring: Sentry SDK integrated.
  Key conventions: Kebab-case filenames, Riverpod providers, Feature-first screen organization.

rules:
  proposal:
    - Include "Non-goals" section
    - Reference existing engine modules that can be reused
  tasks:
    - Each task must have corresponding engine unit test
    - Break tasks into single-PR chunks
    - Mark completed tasks with test evidence

operations:
  apply:
    guidance:
      - Run full engine test suite (dart test) after each change
      - Verify no regression in existing 58+ tests
  archive:
    guidance:
      - Summarize test results and files changed before archiving
