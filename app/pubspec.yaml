name: grid_survival_simulator
description: Stress-test your Grid strategy before the market does.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State management
  flutter_riverpod: ^2.4.0
  
  # Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Charts
  fl_chart: ^0.66.0
  
  # Share
  screenshot: ^2.1.0
  share_plus: ^7.2.0
  path_provider: ^2.1.0
  
  # Utilities
  intl: ^0.20.3
  
  # Local engine package
  grid_engine:
    path: ../packages/grid_engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
